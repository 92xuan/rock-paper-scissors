<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="titleDiv">EPIC BATTLE OF ROCK PAPER SCISSORS</div>
    <span class="buttonsTitle">Choose your weapon</span>
    <div class="buttonsDiv">
        <button class="rockBtn">🪨</button>
        <button class="scissorsBtn">✂️</button>
        <button class="paperBtn">📄</button>
    </div>

    <div class="scoreDisplay"></div>
    <div class="roundDisplay"></div>
    <div class="winnerDisplay"></div>

</body>
</html>
